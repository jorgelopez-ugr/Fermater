name: ImageUpdateAutomation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: fase checkout
        uses: actions/checkout@v4

      - name: realizando un build local
        run: docker build -t fermater_test .

      - name: probando la imagen
        run: docker run -u 1001 -v ${{ github.workspace }}:/app/test fermater_test

      - name: Login a DockerHub con las credenciales predeterminadas
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.NOMBRE }}
          password: ${{ secrets.PASSWORD }}

      - name: Build y Push a DockerHub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: jorgelopez17/fermater:latest